<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="t d" xml:space="preserve"><title id="t">whoami</title><desc id="d">Idan Babayan: cybersecurity student, CTF player, offensive security enthusiast, learning offensive security in public, one box at a time. Focus: web security, reverse engineering, privilege escalation, OSINT and recon, cryptography. Practice: CTFs, intentionally vulnerable labs and my own VMs, legal and controlled, always. Toolbox: Kali, Python, Bash. Next: a first role in security, pentest or red team.</desc><style>@font-face{font-family:IB-S7;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.syne700{font-family:IB-S7,'Arial Black', Impact, sans-serif;font-weight:700}@font-face{font-family:IB-M4;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:IB-M4,ui-monospace, Menlo, Consolas, monospace;font-weight:400}@font-face{font-family:IB-M7;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.mono700{font-family:IB-M7,ui-monospace, Menlo, Consolas, monospace;font-weight:700}text{white-space:pre}@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}@keyframes grow-y{from{transform:scaleY(0)}to{transform:none}}@keyframes grow-x{from{transform:scaleX(0)}to{transform:none}}@keyframes grow{from{transform:scale(0)}to{transform:none}}@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}.fb{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fb" style="transform-origin:center;animation:pop .8s cubic-bezier(.2,.7,.2,1) .05s both"><rect class="fb" x="0" y="0" width="584" height="490" rx="16" fill="#0d1113" stroke="#ffffff" stroke-opacity="0.1"/><text x="36.0 47.4 58.9 70.3 81.8" y="52.0" class="mono700" font-size="13" fill="#b