<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="t d" xml:space="preserve"><title id="t">Recon, foothold, escalation, reflection.</title><desc id="d">The loop every box gets: recon, map the surface before touching it. Foothold, find the crack and slip through. Escalation, climb from user to root. Reflection, document what the defender missed.</desc><style>@font-face{font-family:IB-S7;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.syne700{font-family:IB-S7,'Arial Black', Impact, sans-serif;font-weight:700}@font-face{font-family:IB-M4;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:IB-M4,ui-monospace, Menlo, Consolas, monospace;font-weight:400}@font-face{font-family:IB-M7;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.mono700{font-family:IB-M7,ui-monospace, Menlo, Consolas, monospace;font-weight:700}text{white-space:pre}@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}@keyframes grow-y{from{transform:scaleY(0)}to{transform:none}}@keyframes grow-x{from{transform:scaleX(0)}to{transform:none}}@keyframes grow{from{transform:scale(0)}to{transform:none}}@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}.fb{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes lit1{0%,4.44%{opacity:0}7.44%,21.11%{opacity:1}24.11%,100%{opacity:0}}@keyframes lit2{0%,21.11%{opacity:0}24.11%,37.78%{opacity:1}40.78%,100%{opacity:0}}@keyframes lit3{0%,37.78%{opacity:0}40.78%,54.44%{opacity:1}57.44%,100%{opacity:0}}@keyframes lit4{0%,54.44%{opacity:0}57.44%,71.11%{opacity:1}74.11%,100%{opacity:0}}</style><rect class="fb" x="0.0" y="0" width="288.0" height="236" rx="16" fill="#f7f5ee" stroke="#000000" stroke-opacity="0.13"/><text x="28.0 39.4" y="50